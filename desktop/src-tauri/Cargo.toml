[package]
name = "herdeck-desktop"
version = "0.8.0"
description = "herdeck desktop app — floating Tauri shell (phase 1)"
authors = ["Filip Vaclavik"]
edition = "2021"
rust-version = "1.77"

# A lib target (in addition to the bin) so the sidecar-supervisor logic is
# importable by integration tests under tests/.
[lib]
name = "herdeck_desktop_lib"
crate-type = ["lib"]

[[bin]]
name = "herdeck-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"

[target.'cfg(unix)'.dependencies]
# Already in the tree (tauri); used directly to redirect stderr into the app log.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSUserNotification"] }
# Already in the tree via tauri-plugin-notification -> notify-rust; used directly
# to attach the sound to the banner and to attribute it to our bundle.
mac-notification-sys = "0.6"

[profile.release]
opt-level = "s"
lto = true
strip = true
