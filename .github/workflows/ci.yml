name: ci
on: [push, pull_request]
jobs:
  herdr-api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check pinned Herdr API contract
        run: python scripts/check-herdr-api.py --download

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/set-version.py --check
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: python -m pytest -v --cov=herdeck --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: desktop (vitest)
        working-directory: desktop
        run: npm ci && npm test
      - name: streamdeck (vitest)
        working-directory: streamdeck
        run: npm ci && npm test

  desktop-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build embedded desktop frontend
        working-directory: desktop
        run: npm ci && npm run build
      - name: Stage test-only sidecar resource
        run: mkdir -p desktop/src-tauri/resources/herdeck-deckapp
      - name: Test desktop Rust shell
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
